# The environment's base image, built on each architecture's own runner, tested
# as the launcher starts it, and published from main as one multi-architecture
# image: ghcr.io/mcencini/mritogetherthon:base (and base-<commit>). The QSI
# workflow (qsi.yml) then builds the full environment on it, tests it, and
# publishes it as :latest, the image the launchers start.
name: Image

on:
  # A rebuild publishes new layers, which every attendee's launcher then
  # downloads: main rebuilds only when the image's recipe changes. The hands-on
  # material reaches the attendees without it (sync-material), and is tested by
  # its pull requests, which build the image and run the days' notebooks.
  push:
    branches: [main]
    paths:
      - docker/**
      - .dockerignore
      - .github/workflows/image.yml
  pull_request:
    paths:
      - docker/**
      - tests/smoke.py
      - tests/notebook.py
      - tests/fixtures/**
      - handson/**
      - .dockerignore
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        run: docker build -f docker/Dockerfile -t mritogetherthon .
      # As the launcher starts it: as the runner's user, on a folder of the
      # runner's, published on 127.0.0.1 alone.
      - name: Start it as the launcher does
        run: |
          mkdir work
          docker run -d --name mritogetherthon -p 127.0.0.1:8899:8888 \
            --user "$(id -u):$(id -g)" -e JUPYTER_TOKEN=smoke \
            -v "$PWD/work:/home/mri" -v "$PWD/tests:/tests:ro" -v "$PWD/handson:/handson:ro" mritogetherthon
          for i in $(seq 60); do curl -fs -o /dev/null http://127.0.0.1:8899/api && break; sleep 2; done
          curl -fs "http://127.0.0.1:8899/api/kernelspecs?token=smoke" | python3 -m json.tool
      - name: Check the setup
        run: docker exec mritogetherthon check-setup
      - name: Run a notebook in each kernel
        run: docker exec mritogetherthon python /tests/smoke.py
      # Day 1's notebook as completed: attendees get the exercise, whose gaps they
      # fill, in handson/day1; this one runs end to end.
      - name: Run day 1's completed notebook
        run: docker exec mritogetherthon python /tests/notebook.py /tests/fixtures/day1_placenta_b_optimisation_complete.ipynb
      - name: Run day 2's reconstruction notebook
        run: docker exec mritogetherthon python /tests/notebook.py /handson/day2/reconstruction/day2_dwi_epi_reconstruction.ipynb
      - name: Keep the work in the attendee's folder
        run: test -f work/smoke/python.ipynb && test -f work/smoke/julia.ipynb
      - name: Logs
        if: always()
        run: docker logs mritogetherthon
      - name: Publish the architecture's image
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag mritogetherthon "$IMAGE:base-${{ github.sha }}-${{ matrix.arch }}"
          docker push "$IMAGE:base-${{ github.sha }}-${{ matrix.arch }}"

  publish:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Publish one image for both architectures
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in base "base-${{ github.sha }}"; do
            docker buildx imagetools create -t "$IMAGE:$tag" \
              "$IMAGE:base-${{ github.sha }}-amd64" "$IMAGE:base-${{ github.sha }}-arm64"
          done
