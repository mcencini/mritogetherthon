# The environment's image, built on each architecture's own runner, tested as
# the launcher starts it, and published from main as one multi-architecture
# image: ghcr.io/mcencini/mritogetherthon, tagged latest and with the commit.
name: Image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - docker/**
      - tests/smoke.py
      - .dockerignore
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        run: docker build -f docker/Dockerfile -t mritogetherthon .
      # As the launcher starts it: as the runner's user, on a folder of the
      # runner's, published on 127.0.0.1 alone.
      - name: Start it as the launcher does
        run: |
          mkdir work
          docker run -d --name mritogetherthon -p 127.0.0.1:8899:8888 \
            --user "$(id -u):$(id -g)" -e JUPYTER_TOKEN=smoke \
            -v "$PWD/work:/home/mri" -v "$PWD/tests:/tests:ro" mritogetherthon
          for i in $(seq 60); do curl -fs -o /dev/null http://127.0.0.1:8899/api && break; sleep 2; done
          curl -fs "http://127.0.0.1:8899/api/kernelspecs?token=smoke" | python3 -m json.tool
      - name: Check the setup
        run: docker exec mritogetherthon check-setup
      - name: Run a notebook in each kernel
        run: docker exec mritogetherthon python /tests/smoke.py
      - name: Keep the work in the attendee's folder
        run: test -f work/smoke/python.ipynb && test -f work/smoke/julia.ipynb
      - name: Logs
        if: always()
        run: docker logs mritogetherthon
      - name: Publish the architecture's image
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag mritogetherthon "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"
          docker push "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"

  publish:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Publish one image for both architectures
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest "${{ github.sha }}"; do
            docker buildx imagetools create -t "$IMAGE:$tag" \
              "$IMAGE:${{ github.sha }}-amd64" "$IMAGE:${{ github.sha }}-arm64"
          done
