# The launchers the hub page offers, against a stand-in for Docker, on each
# system that runs them.
name: Launcher

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - web/*.sh
      - web/*.bat
      - tests/test_launcher.py
      - .github/workflows/launcher.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_launcher.py -v -p no:cacheprovider
