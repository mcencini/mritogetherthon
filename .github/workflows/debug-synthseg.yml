# Throwaway: DTIPlayground 0.9.14 in the :qsi image, installed as the Dockerfile would.
name: Debug DTIPlayground
on:
  push:
    branches: [qsi-debug]
permissions:
  contents: read
  packages: read
jobs:
  dtiplayground:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image=ghcr.io/mcencini/mritogetherthon-cache:qsi-842ed0176362abe70179c2486d093815d42831bf-amd64
          docker pull -q "$image"
          docker run --rm --user root --entrypoint bash -e DTIPLAYGROUNDTOOLS=/opt/dtiplayground-tools "$image" -c '
            set -x
            pip list --format=freeze > /tmp/c.txt
            pip install -q uv
            uv pip install --system --constraints /tmp/c.txt dtiplayground==0.9.14 2>&1 | tail -25 || exit 1
            mkdir -p /opt/dtiplayground-tools && printf "name: dtiplayground-tools\nversion: none\n" > /opt/dtiplayground-tools/info.yml
            ls $FSLDIR/etc/fslversion && cat $FSLDIR/etc/fslversion
            h=$(mktemp -d); HOME=$h dmriplayground init </dev/null 2>&1 | tail -15; echo "init exit $?"
            cat $h/.niral-dti/global_variables.yml
            cd /tmp && git clone -q --depth 1 --branch v0.9.14 https://github.com/NIRALUser/DTIPlayground.git d && cd d
            pip install -q pytest
            HOME=$(mktemp -d) python -m pytest tests -q -p no:cacheprovider 2>&1 | tail -25'
