# Throwaway: SynthSeg's peak resident memory, in ours and in the official image, same input.
name: Debug SynthSeg memory
on:
  push:
    branches: [qsi-debug]
permissions:
  contents: read
  packages: read
jobs:
  synthseg:
    strategy:
      fail-fast: false
      matrix:
        image: [ours]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          if [ ${{ matrix.image }} = ours ]; then
            image=ghcr.io/mcencini/mritogetherthon-cache:qsi-${QSI_SHA}-arm64
          else
            image=pennlinc/qsiprep:26.2.0
          fi
          echo "$image"
          docker pull -q "$image"
          cat > measure.py <<'PY'
          import os, resource, shutil, subprocess, sys, time
          tf_home = os.environ.get('TEMPLATEFLOW_HOME', '/opt/templateflow')
          t1 = os.path.join(tf_home, 'tpl-MNI152NLin2009cAsym', 'tpl-MNI152NLin2009cAsym_res-01_T1w.nii.gz')
          if not os.path.exists(t1):
              from templateflow import api as tf
              t1 = str(tf.get('MNI152NLin2009cAsym', resolution=1, suffix='T1w', desc=None))
          py = os.environ.get('QSIPREP_FREESURFER_PYTHON')
          cmd = ([py] if py else []) + [shutil.which('mri_synthseg'), '--cpu', '--threads', '1', '--i', t1,
                 '--o', '/tmp/seg.nii.gz', '--post', '/tmp/post.nii.gz', '--qc', '/tmp/qc.csv']
          env = dict(os.environ, TF_USE_LEGACY_KERAS='1', TF_ENABLE_ONEDNN_OPTS='0', OMP_NUM_THREADS='1')
          start = time.time()
          rc = subprocess.run(cmd, env=env).returncode
          print(f'RESULT exit {rc}, {time.time() - start:.0f} s, peak resident memory '
                f'{resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss / 2**20:.2f} GB')
          PY
          docker run --rm --entrypoint bash -v "$PWD/measure.py:/measure.py:ro" "$image" -c \
            'grep MemTotal /proc/meminfo; nproc; python -c "import tensorflow as tf; print(\"tensorflow\", tf.__version__)" 2>/dev/null; ${QSIPREP_FREESURFER_PYTHON:-python} -c "import tensorflow as tf; print(\"synthseg tensorflow\", tf.__version__)" 2>/dev/null; python /measure.py'
        env:
          QSI_SHA: 16d7ea19cc65af43beeb92131842f61fd713af8e
