# Throwaway: does pybids read a parent folder named "motion" as the datatype?
name: Debug pybids
on:
  push:
    branches: [qsi-debug]
permissions:
  contents: read
  packages: read
jobs:
  pybids:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image=ghcr.io/mcencini/mritogetherthon-cache:qsi-2e49aa1a09eddb5597d7078666f419df995d7cfb-amd64
          docker pull -q "$image"
          docker run --rm --entrypoint python "$image" -c '
          import bids, json, os
          print("pybids", bids.__version__)
          for parent in ("motion", "other", "dwi"):
              root = f"/tmp/{parent}/ds"
              os.makedirs(f"{root}/sub-01/dwi")
              json.dump({"Name": "x", "BIDSVersion": "1.8.0"}, open(f"{root}/dataset_description.json", "w"))
              open(f"{root}/sub-01/dwi/sub-01_dwi.nii.gz", "w").close()
              layout = bids.BIDSLayout(root, validate=False)
              f = layout.get(subject="01", extension=".nii.gz")
              print(parent, [(x.entities.get("datatype"), x.entities.get("suffix")) for x in f],
                    "dwi found:", len(layout.get(subject="01", datatype="dwi", suffix="dwi", extension=".nii.gz")))
          '
