# The environment with QSIPrep, QSIRecon and MRIQC (docker/qsi), built on each
# architecture's own runner on top of :latest, tested as the launcher starts it
# and with the three packages' unit tests, and published from the qsi branch as
# ghcr.io/mcencini/mritogetherthon:qsi. :latest is not touched.
name: QSI image

on:
  push:
    branches: [qsi]
  pull_request:
    paths:
      - docker/qsi/**
      - tests/qsi.sh
      - tests/compare_junit.py
      - .github/workflows/qsi.yml
  workflow_dispatch:
    inputs:
      arch:
        description: "Build and test one architecture only (amd64 or arm64), or both"
        default: both

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Each tool's build cache, in the registry: kept whatever else fails, and
  # without the 10 GB limit of GitHub's own cache.
  CACHE: ghcr.io/${{ github.repository }}-cache

jobs:
  # QSIPrep's test data, as its own CI gets it: two small real datasets, and the
  # subjects its simulator, TRXScan, generates. Cached by their versions.
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - name: QSIPrep's sources
        run: git clone -q --depth 1 --branch 26.2.0 https://github.com/PennLINC/qsiprep.git qsiprep
      - id: key
        run: echo "key=qsi-data-${{ hashFiles('qsiprep/.circleci/data_versions.txt', 'qsiprep/.circleci/trxscan_fixtures.txt') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: data
          key: ${{ steps.key.outputs.key }}
      - name: Download and generate
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -a; . qsiprep/.circleci/data_versions.txt; set +a
          mkdir -p data/forrest_gump data/nibs
          curl -fsSL --retry 5 "$FORREST_GUMP_URL" | tar -xJ -C data/forrest_gump
          curl -fsSL --retry 5 "$NIBS_URL" | tar -xJ -C data/nibs
          python3 -m venv venv && . venv/bin/activate
          pip install -q "trxscan[trx]==$(sed -n 's/^TRXSCAN_VERSION=//p' qsiprep/.circleci/trxscan_fixtures.txt)"
          trxscan-fetch sub-60501
          (cd qsiprep && python -m qsiprep.tests.trxscan_fixtures --generate "$GITHUB_WORKSPACE/data")
          du -sh data/*

  # Each tool built on its own runner, in parallel, and cached on its own: a tool
  # that fails rebuilds alone, and one that is unchanged costs a cache download.
  # (c3d builds on TORTOISE's ITK, so its job builds both.)
  tools:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON((inputs.arch == 'amd64' && '["amd64"]') || (inputs.arch == 'arm64' && '["arm64"]') || '["amd64", "arm64"]') }}
        tool: [fsl, ants, unpile, mriqc-wheel, mrtrix3dev, tissue3, niimath, c3d, dsistudio, afni]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.tool }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/qsi/Dockerfile
          target: ${{ matrix.tool }}
          cache-from: |
            type=registry,ref=${{ env.CACHE }}:${{ matrix.tool }}-${{ matrix.arch }}
            type=gha,scope=qsi-ants-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.CACHE }}:${{ matrix.tool }}-${{ matrix.arch }},mode=max

  image:
    needs: [data, tools]
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON((inputs.arch == 'amd64' && '["amd64"]') || (inputs.arch == 'arm64' && '["arm64"]') || '["amd64", "arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tools come from their jobs' caches; only the image itself is built.
      - id: caches
        run: |
          {
            echo "from<<EOF"
            for tool in fsl ants unpile mriqc-wheel mrtrix3dev tissue3 niimath c3d dsistudio afni image; do
              echo "type=registry,ref=$CACHE:$tool-${{ matrix.arch }}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/qsi/Dockerfile
          tags: mritogetherthon
          load: true
          cache-from: ${{ steps.caches.outputs.from }}
          cache-to: type=registry,ref=${{ env.CACHE }}:image-${{ matrix.arch }},mode=max
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: ${{ needs.data.outputs.key }}
          fail-on-cache-miss: true
      - name: Start it as the launcher does
        run: |
          mkdir work
          docker run -d --name mritogetherthon -p 127.0.0.1:8899:8888 \
            --user "$(id -u):$(id -g)" -e JUPYTER_TOKEN=smoke \
            -v "$PWD/work:/home/mri" -v "$PWD/tests:/tests:ro" -v "$PWD/data:/data:ro" mritogetherthon
          for i in $(seq 60); do curl -fs -o /dev/null http://127.0.0.1:8899/api && break; sleep 2; done
      - name: Check the setup
        run: docker exec mritogetherthon check-setup
      - name: Run a notebook in each kernel
        run: docker exec mritogetherthon python /tests/smoke.py
      - name: The tools, and QSIPrep's, QSIRecon's and MRIQC's unit tests
        run: docker exec mritogetherthon sh /tests/qsi.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-ours-${{ matrix.arch }}
          path: work/*.xml
      - name: Size
        if: always()
        run: docker image ls mritogetherthon
      - name: Logs
        if: always()
        run: docker logs mritogetherthon
      - name: Publish the architecture's image
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag mritogetherthon "$IMAGE:qsi-${{ github.sha }}-${{ matrix.arch }}"
          docker push "$IMAGE:qsi-${{ github.sha }}-${{ matrix.arch }}"

  # The same tests, from the same sources, in the official images, so that a
  # failure the official image shares is not counted against ours: QSIPrep's and
  # QSIRecon's are published for amd64 only, MRIQC's for both.
  baseline:
    needs: data
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: qsiprep, org: PennLINC, ref: 26.2.0, arch: amd64}
          - {name: qsirecon, org: PennLINC, ref: 26.0.1, arch: amd64}
          - {name: mriqc, org: nipreps, ref: 26.1.1, arch: amd64}
          - {name: mriqc, org: nipreps, ref: 26.1.1, arch: arm64}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: ${{ needs.data.outputs.key }}
          fail-on-cache-miss: true
      # The official environments hold no pip, and QSIRecon's no pytest: pytest
      # is installed on the runner, for the image's Python, and mounted. pip
      # evaluates markers for the runner's Python, so the backports pytest needs
      # before 3.11 are named.
      - name: Unit tests in ${{ matrix.org }}/${{ matrix.name }}:${{ matrix.ref }}
        run: |
          image=$(echo "${{ matrix.org }}" | tr A-Z a-z)/${{ matrix.name }}:${{ matrix.ref }}
          docker pull -q "$image"
          py=$(docker run --rm --entrypoint python "$image" -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')
          echo "Python $py"
          python3 -m pip install -q --target deps --python-version "$py" --only-binary=:all: \
            pytest pytest-xdist pytest-env toml exceptiongroup tomli
          git clone -q --depth 1 --branch ${{ matrix.ref }} https://github.com/${{ matrix.org }}/${{ matrix.name }}.git src
          mkdir reports && chmod a+w reports
          case ${{ matrix.name }} in
            mriqc) tests='cp "$(python -I -c "import mriqc, os; print(os.path.dirname(mriqc.__file__))")/_version.py" mriqc/ && \
                     python -m pytest mriqc -o addopts= -ra -p no:cacheprovider -p no:datalad -n auto \
                       --doctest-modules --ignore=mriqc/bin --ignore=mriqc/interfaces/transitional.py' ;;
            *) tests='mkdir -p /tmp/qsi-out /tmp/qsi-work && python -m pytest ${{ matrix.name }}/tests -n auto -q \
                     -p no:cacheprovider --data_dir=/data --output_dir=/tmp/qsi-out --working_dir=/tmp/qsi-work' ;;
          esac
          docker run --rm --entrypoint bash -e PYTHONPATH=/deps \
            -v "$PWD/deps:/deps:ro" -v "$PWD/src:/src:ro" -v "$PWD/reports:/reports" -v "$PWD/data:/data:ro" "$image" -c \
            "cp -r /src /tmp/src && cd /tmp/src && $tests --junitxml=/reports/${{ matrix.name }}.xml" || true
          test -s reports/${{ matrix.name }}.xml
      - uses: actions/upload-artifact@v4
        with:
          name: junit-official-${{ matrix.name }}-${{ matrix.arch }}
          path: reports/*.xml

  compare:
    needs: [image, baseline]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: junit
      - name: Tests that fail in ours but pass in the official image
        run: |
          status=0
          for arch in amd64 arm64; do
            [ -d junit/junit-ours-$arch ] || { echo "== $arch: not built in this run"; continue; }
            for name in qsiprep qsirecon mriqc; do
              # The official image of the same architecture, or amd64's, the only one published
              official=junit/junit-official-$name-$arch
              [ -d "$official" ] || official=junit/junit-official-$name-amd64
              echo "== $name, ours on $arch, official on ${official##*-}"
              python tests/compare_junit.py junit/junit-ours-$arch/$name.xml "$official/$name.xml" || status=1
            done
          done
          exit $status

  publish:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Publish one image for both architectures
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in qsi "qsi-${{ github.sha }}"; do
            docker buildx imagetools create -t "$IMAGE:$tag" \
              "$IMAGE:qsi-${{ github.sha }}-amd64" "$IMAGE:qsi-${{ github.sha }}-arm64"
          done
