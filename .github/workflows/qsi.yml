# The environment with QSIPrep and QSIRecon (docker/qsi), built on each
# architecture's own runner on top of :latest, tested as the launcher starts it
# and with the two packages' unit tests, and published from the qsi branch as
# ghcr.io/mcencini/mritogetherthon:qsi. :latest is not touched.
name: QSI image

on:
  push:
    branches: [qsi]
  pull_request:
    paths:
      - docker/qsi/**
      - tests/qsi.sh
      - tests/compare_junit.py
      - .github/workflows/qsi.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      # Cached in GitHub's cache, so that a push rebuilds only what changed:
      # ANTs' compilation on arm64 takes long.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/qsi/Dockerfile
          tags: mritogetherthon
          load: true
          cache-from: type=gha,scope=qsi-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=qsi-${{ matrix.arch }}
      - name: Start it as the launcher does
        run: |
          mkdir work
          docker run -d --name mritogetherthon -p 127.0.0.1:8899:8888 \
            --user "$(id -u):$(id -g)" -e JUPYTER_TOKEN=smoke \
            -v "$PWD/work:/home/mri" -v "$PWD/tests:/tests:ro" mritogetherthon
          for i in $(seq 60); do curl -fs -o /dev/null http://127.0.0.1:8899/api && break; sleep 2; done
      - name: Check the setup
        run: docker exec mritogetherthon check-setup
      - name: Run a notebook in each kernel
        run: docker exec mritogetherthon python /tests/smoke.py
      - name: QSIPrep's and QSIRecon's tools and unit tests
        run: docker exec mritogetherthon sh /tests/qsi.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-ours-${{ matrix.arch }}
          path: work/*.xml
      - name: Size
        if: always()
        run: docker image ls mritogetherthon
      - name: Logs
        if: always()
        run: docker logs mritogetherthon
      - name: Publish the architecture's image
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag mritogetherthon "$IMAGE:qsi-${{ github.sha }}-${{ matrix.arch }}"
          docker push "$IMAGE:qsi-${{ github.sha }}-${{ matrix.arch }}"

  # The same tests, from the same sources, in the official images (amd64 only),
  # so that a failure the official image shares is not counted against ours.
  baseline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qsiprep
            ref: 26.2.0
          - name: qsirecon
            ref: 26.0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      # The official environments hold neither pip nor, in QSIRecon's, pytest:
      # pytest is installed on the runner, for the image's Python, and mounted:
      # pip evaluates markers for the runner's Python, so the backports pytest
      # needs before 3.11 are named.
      - name: Unit tests in pennlinc/${{ matrix.name }}:${{ matrix.ref }}
        run: |
          image=pennlinc/${{ matrix.name }}:${{ matrix.ref }}
          docker pull -q "$image"
          py=$(docker run --rm --entrypoint python "$image" -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')
          echo "Python $py"
          python3 -m pip install -q --target deps --python-version "$py" --only-binary=:all: \
            pytest pytest-xdist pytest-env toml exceptiongroup tomli
          git clone -q --depth 1 --branch ${{ matrix.ref }} https://github.com/PennLINC/${{ matrix.name }}.git src
          mkdir reports && chmod a+w reports
          docker run --rm --entrypoint bash -e PYTHONPATH=/deps \
            -v "$PWD/deps:/deps:ro" -v "$PWD/src:/src:ro" -v "$PWD/reports:/reports" "$image" -c \
            'cp -r /src /tmp/src && cd /tmp/src && python -m pytest ${{ matrix.name }}/tests -n auto -q -p no:cacheprovider --junitxml=/reports/${{ matrix.name }}.xml' || true
          test -s reports/${{ matrix.name }}.xml
      - uses: actions/upload-artifact@v4
        with:
          name: junit-official-${{ matrix.name }}
          path: reports/*.xml

  compare:
    needs: [image, baseline]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: junit
      - name: Tests that fail in ours but pass in the official image
        run: |
          status=0
          for arch in amd64 arm64; do
            for name in qsiprep qsirecon; do
              echo "== $name, $arch"
              python tests/compare_junit.py junit/junit-ours-$arch/$name.xml junit/junit-official-$name/$name.xml || status=1
            done
          done
          exit $status

  publish:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Publish one image for both architectures
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in qsi "qsi-${{ github.sha }}"; do
            docker buildx imagetools create -t "$IMAGE:$tag" \
              "$IMAGE:qsi-${{ github.sha }}-amd64" "$IMAGE:qsi-${{ github.sha }}-arm64"
          done
