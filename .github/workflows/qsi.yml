# The environment with QSIPrep and QSIRecon (docker/qsi), built on each
# architecture's own runner on top of :latest, tested as the launcher starts it
# and with the two packages' unit tests, and published from the qsi branch as
# ghcr.io/mcencini/mritogetherthon:qsi. :latest is not touched.
name: QSI image

on:
  push:
    branches: [qsi]
  pull_request:
    paths:
      - docker/qsi/**
      - tests/qsi.sh
      - .github/workflows/qsi.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        run: docker build -f docker/qsi/Dockerfile -t mritogetherthon .
      - name: Start it as the launcher does
        run: |
          mkdir work
          docker run -d --name mritogetherthon -p 127.0.0.1:8899:8888 \
            --user "$(id -u):$(id -g)" -e JUPYTER_TOKEN=smoke \
            -v "$PWD/work:/home/mri" -v "$PWD/tests:/tests:ro" mritogetherthon
          for i in $(seq 60); do curl -fs -o /dev/null http://127.0.0.1:8899/api && break; sleep 2; done
      - name: Check the setup
        run: docker exec mritogetherthon check-setup
      - name: Run a notebook in each kernel
        run: docker exec mritogetherthon python /tests/smoke.py
      - name: QSIPrep's and QSIRecon's tools and unit tests
        run: docker exec mritogetherthon sh /tests/qsi.sh
      - name: Size
        if: always()
        run: docker image ls mritogetherthon
      - name: Logs
        if: always()
        run: docker logs mritogetherthon
      - name: Publish the architecture's image
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag mritogetherthon "$IMAGE:qsi-${{ github.sha }}-${{ matrix.arch }}"
          docker push "$IMAGE:qsi-${{ github.sha }}-${{ matrix.arch }}"

  publish:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Publish one image for both architectures
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in qsi "qsi-${{ github.sha }}"; do
            docker buildx imagetools create -t "$IMAGE:$tag" \
              "$IMAGE:qsi-${{ github.sha }}-amd64" "$IMAGE:qsi-${{ github.sha }}-arm64"
          done
